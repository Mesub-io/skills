name: CI

# Pull requests to main and main itself: a branch nobody proposed costs nothing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit: a tag can be moved to point at other code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history: skill versions are compared with the base.
          fetch-depth: 0
      # The docs, to check that every skill's sources exist there.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Mesub-io/docs
          path: .docs-site
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # No pnpm version here: the action reads packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm validate --docs-site .docs-site
        env:
          # The commit to compare skill versions with: the PR's base, or main before the push.
          MESUB_SKILLS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
